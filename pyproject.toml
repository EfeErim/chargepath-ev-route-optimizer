[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chargepath-ev-route-optimizer"
version = "0.1.0"
description = "A local-first EV trip optimizer that selects charging stops over road-network legs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/leaflet-BSD-2-Clause.txt"]
authors = [{ name = "Efe Erim" }]
dependencies = []
classifiers = ["Programming Language :: Python :: 3.11"]

[project.scripts]
chargepath-demo = "chargepath.demo:main"

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chargepath.web" = ["*.html", "*.css", "*.js"]

[tool.setuptools.data-files]
"share/chargepath" = ["data/sample/synthetic_corridor.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]
