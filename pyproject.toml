[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chargepath-ev-route-optimizer"
version = "0.4.0"
description = "A local-first EV trip optimizer that selects charging stops over road-network legs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/chargepath/web/LICENSE-leaflet.txt"]
authors = [{ name = "Efe Erim" }]
dependencies = []

[project.urls]
Homepage = "https://efeerim.github.io/chargepath-ev-route-optimizer/"
Repository = "https://github.com/EfeErim/chargepath-ev-route-optimizer"
Changelog = "https://github.com/EfeErim/chargepath-ev-route-optimizer/blob/main/CHANGELOG.md"

[project.scripts]
chargepath-demo = "chargepath.demo.server:main"

[project.optional-dependencies]
dev = [
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]
browser = ["playwright==1.64.1"]
pilot = ["pyarrow==21.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chargepath" = ["data/*.json"]
"chargepath.web" = ["*.html", "*.css", "*.js", "LICENSE-leaflet.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts/plan_synthetic_trip.py"]
