[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chargepath-ev-route-optimizer"
version = "0.3.0"
description = "A local-first EV trip optimizer that selects charging stops over road-network legs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/leaflet-BSD-2-Clause.txt"]
authors = [{ name = "Efe Erim" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://efeerim.github.io/chargepath-ev-route-optimizer/"
Repository = "https://github.com/EfeErim/chargepath-ev-route-optimizer"
Changelog = "https://github.com/EfeErim/chargepath-ev-route-optimizer/blob/main/CHANGELOG.md"

[project.scripts]
chargepath-demo = "chargepath.demo.server:main"

[project.optional-dependencies]
dev = [
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]
# Only for browser_tests/, which also needs `python -m playwright install chromium` and network.
browser = [
  "playwright==1.64.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chargepath.web" = ["*.html", "*.css", "*.js"]

[tool.setuptools.data-files]
"share/chargepath" = ["data/sample/synthetic_corridor.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]
