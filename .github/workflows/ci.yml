name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11.9", "3.13.5"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints/release-py311.txt
      - name: Install project
        run: |
          python -m pip install --upgrade "pip==26.2" "setuptools==83.0.0"
          python -m pip install --constraint constraints/release-py311.txt --editable ".[dev]"
      - name: Record environment
        run: |
          python --version
          python -m pip --version
          python -m pip list --format=freeze
      - name: Run project gate
        shell: pwsh
        run: |
          # Otherwise check.ps1 prefers `py -3.11`, which skips the matrix Python on Windows.
          $env:CHARGEPATH_PYTHON = (Get-Command python).Source
          ./scripts/check.ps1
