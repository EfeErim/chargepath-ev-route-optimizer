name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: constraints/release-py311.txt
      - name: Install project
        run: |
          python -m pip install --upgrade "pip==26.2" "setuptools==83.0.0"
          python -m pip install --constraint constraints/release-py311.txt --editable ".[dev]"
      - name: Record environment
        run: |
          python --version
          python -m pip --version
          python -m pip list --format=freeze
      - name: Run project gate
        shell: pwsh
        run: ./scripts/check.ps1
